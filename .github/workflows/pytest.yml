name: PyTests

on:
  - pull_request
jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POETRY_VIRTUALENVS_CREATE: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run tests
        run: |
          # vboxapi is built from the SDK of a locally installed VirtualBox, which the runner
          # has none of. The unit tests never reach the VirtualBox API, so it is left out.
          uv sync --locked --no-install-package vboxapi
          uv run --no-sync pytest ./tests/unit
