[project]
name = "VBox_Tests_Runner"
version = "0.1.0"
description = ""
authors = [{ name = "l02", email = "l8556@outlook.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "invoke>=3",
    "rich>=15",
    "paramiko>=5",
    "pandas>=3.0.5",
    "elevate>=0.1.3",
    "ruff>=0.16.7",
    "pydantic>=2.13.4",
    "pyppmd>=1.2.0",
    "inflate64>=1.0.3",
    "py7zr>=1.1.3",
    "aiohttp>=3.14.3",
    "host-tools",
    "telegram",
    "vboxwrapper[api]",
    "ssh-wrapper",
    "report-portal",
    "s3wrapper",
    "pytest>=9.1.1",
    "apscheduler>=3.11.3",
]

[tool.uv.sources]
host-tools = { git = "https://github.com/l8556/host_tools.git", branch = "master" }
telegram = { git = "https://github.com/l8556/TelegramApi.git", branch = "master" }
vboxwrapper = { git = "https://github.com/l8556/VBoxWrapper.git", branch = "feature/install-vboxapi-with-uv" }
ssh-wrapper = { git = "https://github.com/l8556/SshWrapper.git", branch = "master" }
report-portal = { git = "https://github.com/l8556/report_portal.git", branch = "master" }
s3wrapper = { git = "https://github.com/l8556/S3Wrapper.git", branch = "master" }

[tool.ruff.lint]
# Ruff 0.16 grew its implicit default set from 59 to 413 rules, so the selection
# is pinned here instead of relying on whatever the installed version defaults to.
select = ["E4", "E7", "E9", "F"]
